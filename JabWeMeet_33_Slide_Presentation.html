    function renderSlides() {
      const container = document.getElementById("slidesContainer");
      SLIDES_DATA.forEach((s) => {
        const div = document.createElement("div");
        div.className = "slide";
        let inner = `
          <div class="slide-header">
            <div class="slide-badge">${s.num}</div>
            <div>
              <div class="slide-title">${s.title}</div>
              <div class="slide-subtitle">${s.subtitle}</div>
            </div>
          </div>
        `;

        if (s.chart) {
          inner += `<div class="chart-box" style="margin-bottom:16px;">
            <div class="chart-title">📊 ${s.chart.title}</div>
            ${s.chart.bars.map(b => `
              <div class="bar-row">
                <div class="bar-label">${b.label}</div>
                <div class="bar-track">
                  <div class="bar-fill ${b.color}" style="width:${b.pct}%">${b.val}</div>
                </div>
              </div>
            `).join("")}
          </div>`;
        }

        if (s.flow) {
          inner += `<div class="grid-5" style="margin-top:12px;">
            ${s.flow.map(f => `
              <div class="flow-step">
                <h4>${f.step}</h4>
                <p>${f.text}</p>
              </div>
            `).join("")}
          </div>`;
        }

        if (s.table) {
          inner += `<table class="comp-table">
            <thead>
              <tr>
                ${s.table.headers.map((h, i) => `<th class="${i === s.table.headers.length - 1 ? 'ours' : ''}">${h}</th>`).join("")}
              </tr>
            </thead>
            <tbody>
              ${s.table.rows.map(r => `
                <tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>
              `).join("")}
            </tbody>
          </table>`;
        }

        if (s.cards) {
          inner += `<div class="grid-2">
            ${s.cards.map(c => `
              <div class="card">
                <div class="card-head ${c.color || ''}">${c.title}</div>
                <ul class="card-body">
                  ${c.items.map(it => `<li>${it}</li>`).join("")}
                </ul>
              </div>
            `).join("")}
          </div>`;
        }

        inner += `<div class="slide-footer">JabWeMeet Project Blueprint  |  Slide ${s.num} of 33</div>`;
        div.innerHTML = inner;
        container.appendChild(div);
      });
    }

            });
            slide.addText("CHART: " + s.chart.title, {
              x: 0.55, y: contentY + 0.06, w: 8.9, h: 0.26, fontSize: 11, bold: true, color: C.burgundy
            });
            s.chart.bars.forEach((b, idx) => {
              const by = contentY + 0.36 + idx * 0.24;
              slide.addText(b.label, { x: 0.55, y: by, w: 1.9, h: 0.2, fontSize: 9, bold: true, color: C.slateDark });
              const barW = Math.max(1.2, (b.pct / 100) * 6.8);
              slide.addShape(pptx.ShapeType.roundRect, {
                x: 2.5, y: by + 0.02, w: barW, h: 0.18,
                fill: { color: b.color === "emerald" ? C.emerald : b.color === "blue" ? C.blue : C.burgundy },
                rectRadius: 0.04
              });
              slide.addText(b.val, { x: 2.58, y: by, w: barW + 1.5, h: 0.2, fontSize: 8.5, bold: true, color: C.white });
            });
            contentY += 1.78;
          }

          if (s.flow) {
            s.flow.forEach((f, idx) => {
              const fx = 0.4 + idx * 1.86;
              slide.addShape(pptx.ShapeType.roundRect, {
                x: fx, y: 1.15, w: 1.74, h: 3.6,
                fill: { color: C.white }, line: { color: C.burgundy, width: 1.5 }, rectRadius: 0.08
              });
              slide.addShape(pptx.ShapeType.rect, {
                x: fx, y: 1.15, w: 1.74, h: 0.42, fill: { color: C.burgundy }
              });
              slide.addText(f.step, {
                x: fx, y: 1.15, w: 1.74, h: 0.42, fontSize: 9.5, bold: true, color: C.white, align: "center", valign: "middle"
              });
              slide.addText(f.text, {
                x: fx + 0.08, y: 1.7, w: 1.58, h: 2.8, fontSize: 10, color: C.slateDark, align: "center", valign: "top"
              });
            });
          }

          if (s.table) {
            const rows = [
              s.table.headers.map((h, i) => ({
                text: h,
                options: { bold: true, color: C.white, fill: i === s.table.headers.length - 1 ? C.emerald : C.burgundy }
              })),
              ...s.table.rows
            ];
            slide.addTable(rows, {
              x: 0.4, y: contentY, w: 9.2, rowH: 0.46, fontSize: 9.5,
              border: { type: "solid", color: C.roseBorder, pt: 0.8 }, fill: { color: C.white }, valign: "middle"
            });
          }

          if (s.cards) {
            const cardH = 5.15 - contentY;
            const isFour = s.cards.length === 4;
            s.cards.forEach((c, idx) => {
              const col = idx % 2;
              const row = Math.floor(idx / 2);
              const cw = 4.5;
              const ch = isFour ? (cardH - 0.16) / 2 : cardH;
              const cx = 0.4 + col * 4.7;
              const cy = contentY + row * (ch + 0.16);

              const hBg = c.color === "emerald" ? C.emeraldBg : c.color === "blue" ? C.blueBg : c.color === "amber" ? C.amberBg : c.color === "purple" ? C.purpleBg : C.softRose;
              const hCol = c.color === "emerald" ? C.emerald : c.color === "blue" ? C.blue : c.color === "amber" ? C.amber : c.color === "purple" ? C.purple : C.burgundy;

              slide.addShape(pptx.ShapeType.roundRect, {
                x: cx, y: cy, w: cw, h: ch,
                fill: { color: C.white }, line: { color: C.roseBorder, width: 1.1 }, rectRadius: 0.06
              });
              slide.addShape(pptx.ShapeType.rect, {
                x: cx, y: cy, w: cw, h: 0.34, fill: { color: hBg }
              });
              slide.addText(c.title, {
                x: cx + 0.1, y: cy + 0.03, w: cw - 0.2, h: 0.28, fontSize: 11, bold: true, color: hCol
              });
              const bullets = c.items.map((it, bIdx) => ({
                text: it,
                options: { bullet: true, breakLine: bIdx < c.items.length - 1 }
              }));
              slide.addText(bullets, {
                x: cx + 0.1, y: cy + 0.38, w: cw - 0.2, h: ch - 0.42,
                fontSize: s.chart ? 8.8 : 9.8, color: C.slateDark, valign: "top", lineSpacing: s.chart ? 12 : 14
              });
            });
          }

          slide.addText(`JabWeMeet Project Blueprint  |  Slide ${s.num} of 33`, {
            x: 0.4, y: 5.32, w: 9.2, h: 0.2, fontSize: 8.5, color: C.slateMuted, align: "right"
          });
        });

        pptx.writeFile({ fileName: "JabWeMeet_Complete_33_Slide_Presentation.pptx" }).then(() => {
          btn.textContent = "✅ Downloaded JabWeMeet_Complete_33_Slide_Presentation.pptx!";
          setTimeout(() => { btn.textContent = "⬇ Download PowerPoint (.PPTX)"; }, 4000);
        });
      } catch (err) {
        console.error(err);
        btn.textContent = "⬇ Download PowerPoint (.PPTX)";
        alert("Could not generate PPTX: " + err.message);
      }
    }

    renderSlides();
  </script>
</body>
</html>
